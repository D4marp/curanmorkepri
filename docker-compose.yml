services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-curanmor_ai}
      POSTGRES_USER: ${POSTGRES_USER:-curanmor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?wajib diisi di .env}
    volumes:
      - curanmor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-curanmor} -d ${POSTGRES_DB:-curanmor_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Port database TIDAK dipublikasikan ke host secara default — hanya
    # dapat diakses dari dalam jaringan docker-compose (service `api`).
    # Buka komentar baris di bawah hanya untuk kebutuhan debug lokal.
    # ports:
    #   - "5432:5432"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      HTTP_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-curanmor}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-curanmor_ai}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?wajib diisi di .env — minimal 32 karakter acak}
      JWT_ISSUER: ${JWT_ISSUER:-curanmor-ai.polda-kepri.go.id}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?wajib diisi di .env — minimal 32 karakter acak}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-60}
      SEED_ADMIN_NRP: ${SEED_ADMIN_NRP:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
    volumes:
      - curanmor_uploads:/app/uploads
    ports:
      - "${HTTP_PUBLISH_PORT:-8080}:8080"

volumes:
  curanmor_pgdata:
  curanmor_uploads:
